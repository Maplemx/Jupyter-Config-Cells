name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/vscode/package-lock.json
            packages/jupyterlab/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix packages/vscode install
          npm --prefix packages/jupyterlab install
      - name: Test VS Code extension
        run: npm run test:vscode
      - name: Test JupyterLab extension
        run: npm run test:jupyterlab
